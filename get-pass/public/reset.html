<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إعادة تعيين كلمة المرور — MAB</title>
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" type="image/png" href="/assets/logo.png?v=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=49" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card" style="max-width:460px">
      <img class="auth-logo" src="/assets/logo.png" onerror="this.onerror=null;this.src='/assets/mab-logo.svg'" alt="MAB" />
      <h1>إعادة تعيين كلمة المرور</h1>
      <p class="sub">أدخل كلمة المرور الجديدة لحسابك</p>
      <form id="form">
        <div class="field">
          <label>كلمة المرور الجديدة</label>
          <input id="pw" type="password" dir="ltr" autocomplete="new-password" placeholder="••••••••" />
        </div>
        <div class="field">
          <label>تأكيد كلمة المرور</label>
          <input id="pw2" type="password" dir="ltr" autocomplete="new-password" placeholder="••••••••" />
        </div>
        <button class="btn block" type="submit">حفظ كلمة المرور</button>
      </form>
      <div id="result" style="margin-top:16px"></div>
      <p style="margin-top:14px;text-align:center"><a href="/" style="color:#2563eb">العودة لتسجيل الدخول</a></p>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const token = new URLSearchParams(location.search).get('token') || '';
    const result = $('result');
    function msg(html, ok) {
      result.innerHTML = '<div class="hint ' + (ok ? 'ok' : 'err') + '" style="padding:10px;border-radius:8px">' + html + '</div>';
    }
    if (!token) msg('الرابط غير مكتمل. افتح الرابط من رسالة البريد كاملاً.', false);

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = $('pw').value, pw2 = $('pw2').value;
      if (pw.length < 6) return msg('كلمة المرور يجب ألا تقل عن 6 أحرف.', false);
      if (pw !== pw2) return msg('كلمتا المرور غير متطابقتين.', false);
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: pw }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'تعذّرت إعادة التعيين.');
        msg('تم تغيير كلمة المرور بنجاح ✅ سيتم تحويلك لتسجيل الدخول…', true);
        setTimeout(() => location.replace('/'), 1800);
      } catch (err) {
        msg(err.message, false);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
