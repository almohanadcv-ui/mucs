# منصّة MAB — إعداد nginx (بروكسي للمنفذ 3005).
# التركيب على الخادم:
#   sudo cp /var/www/mucs/mab-portal/deploy/nginx-portal.conf /etc/nginx/sites-available/portal.mucs.online
#   sudo ln -sf /etc/nginx/sites-available/portal.mucs.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d portal.mucs.online     # بعد ضبط DNS (سجل A لـ portal)
#
# ملاحظة: certbot سيضيف تلقائيًا كتلة 443 (SSL) ويحوّل 80 إليها.

server {
    listen 80;
    listen [::]:80;
    server_name portal.mucs.online;

    # حدّ رفع أكبر لملفات Excel للموظفين
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
